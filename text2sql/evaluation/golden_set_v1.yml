    source_question_vi: "Top 10 sản phẩm bán nhiều nhất"
    source_question_en: "What are the 10 best-selling products?"
    question_vi: "Cho top 10 sản phẩm theo units_sold giảm dần và trả đúng các cột product_code, product_name, category, units_sold, total_sales, units_sold_rank."
    question_en: "Show the top 10 products by units_sold descending and return exactly product_code, product_name, category, units_sold, total_sales, and units_sold_rank."
    paraphrase_vi: "Sản phẩm nào bán được nhiều đơn vị nhất? Lấy top 10 theo units_sold, kèm product_code, product_name, category, total_sales và units_sold_rank."
