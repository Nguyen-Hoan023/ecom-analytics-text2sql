      type: sql
      sql: |
        SELECT gender, occupation, customer_count
        FROM analytics_gold.mart_customer_profile_by_gender_occupation
        WHERE customer_count >= 10
        ORDER BY gender, occupation
    expected_result:
      row_count: 15
      expected_population: 17415
      rows_by_gender_occupation:
        - {gender: F, occupation: Clerical, customer_count: 1335}
        - {gender: F, occupation: Management, customer_count: 1382}
        - {gender: F, occupation: Manual, customer_count: 1078}
        - {gender: F, occupation: Professional, customer_count: 2626}
        - {gender: F, occupation: Skilled Manual, customer_count: 2137}
        - {gender: M, occupation: Clerical, customer_count: 1386}
        - {gender: M, occupation: Management, customer_count: 1486}
        - {gender: M, occupation: Manual, customer_count: 1185}
        - {gender: M, occupation: Professional, customer_count: 2517}
        - {gender: M, occupation: Skilled Manual, customer_count: 2159}
        - {gender: Unknown, occupation: Clerical, customer_count: 29}
        - {gender: Unknown, occupation: Management, customer_count: 19}
        - {gender: Unknown, occupation: Manual, customer_count: 18}
        - {gender: Unknown, occupation: Professional, customer_count: 33}
        - {gender: Unknown, occupation: Skilled Manual, customer_count: 25}
      caveat: "Unknown groups are retained. The minimum group size is also enforced by the SQL validator."

  - case_id: q05
    level: basic
    source_question_vi: "Tỷ lệ Discount trung bình theo Danh mục sản phẩm"
    source_question_en: "What is the average discount by product category?"
    question_vi: "Theo từng category, trả category, average_discount và sales_line_count; average_discount là trung bình có trọng số theo số dòng giao dịch, gồm cả discount 0% và giữ Unknown."
    question_en: "By category, return category, average_discount, and sales_line_count; calculate average_discount as a transaction-line-weighted average, include zero-discount lines, and retain Unknown."
    paraphrase_vi: "Mỗi category có average_discount và sales_line_count là bao nhiêu? Tính trung bình discount trên các dòng giao dịch, gồm cả dòng 0% và Unknown."
    behavior: answer
    expected_relations: [analytics_gold.mart_discount_profitability]
    expected_columns: [category, average_discount, sales_line_count]
    metric_contracts: [average_discount]
    baseline:
      type: sql
      sql: |
        SELECT
            category,
            SUM(avg_discount * sales_line_count)
                / NULLIF(SUM(sales_line_count), 0) AS average_discount,
            SUM(sales_line_count) AS sales_line_count
        FROM analytics_gold.mart_discount_profitability
        WHERE avg_discount IS NOT NULL
        GROUP BY category
        ORDER BY category
    expected_result:
      row_count: 6
      scalar:
        sales_line_count: 51290
        overall_weighted_average_discount: "0.142883"
      caveat: "Discount is stored as a 0–1 fraction; format as a percentage for display. Weight band averages by sales_line_count."

  - case_id: q06
    level: intermediate
    source_question_vi: "Tỷ lệ Profit Margin theo Thị trường (Market)"
    source_question_en: "What is the profit margin by market?"
    question_vi: "Theo từng market, trả market, sales_line_count, order_count, total_sales, total_profit và profit_margin; giữ Unknown thành nhóm riêng."
    question_en: "By market, return market, sales_line_count, order_count, total_sales, total_profit, and profit_margin; keep Unknown as its own group."
    paraphrase_vi: "Với mỗi market, hiển thị sales_line_count, order_count, total_sales, total_profit và profit_margin; giữ Unknown riêng."
    behavior: answer
    expected_relations: [analytics_gold.mart_profitability_by_market]
    expected_columns: [market, sales_line_count, order_count, total_sales, total_profit, profit_margin]
    metric_contracts: [total_sales, total_profit, profit_margin]
    baseline:
      type: sql
      sql: |
        SELECT market, sales_line_count, order_count, total_sales, total_profit, profit_margin
        FROM analytics_gold.mart_profitability_by_market
        ORDER BY market
    expected_result:
      row_count: 6
      scalar:
        sales_line_count: 51290
        total_sales: "6517674.00"
        total_profit: "1065413.58"
      rows_by_key:
        - {market: Unknown, sales_line_count: 2, order_count: 1, total_sales: "486.00", total_profit: "243.00"}
      caveat: "Unknown represents unmatched or missing market information; do not assign it to a named market."

  - case_id: q07
    level: intermediate
    source_question_vi: "Thống kê số lượng đơn hàng bị lỗ theo Phân khúc"
    source_question_en: "How many loss-making orders are there by segment?"
    question_vi: "Theo từng segment, trả segment, order_count, loss_making_order_count và loss_making_order_rate; đơn lỗ khi tổng profit của order nhỏ hơn 0."
    question_en: "By segment, return segment, order_count, loss_making_order_count, and loss_making_order_rate; an order is loss-making when its summed profit is below zero."
    paraphrase_vi: "Với mỗi segment, cho order_count, loss_making_order_count và loss_making_order_rate; xác định lỗ theo tổng profit của cả order."
    behavior: answer
    expected_relations: [analytics_gold.mart_loss_making_orders_by_segment]
    expected_columns: [segment, order_count, loss_making_order_count, loss_making_order_rate]
    metric_contracts: [loss_making_order_rate]
    baseline:
      type: sql
      sql: |
        SELECT segment, order_count, loss_making_order_count, loss_making_order_rate
        FROM analytics_gold.mart_loss_making_orders_by_segment
        ORDER BY segment
    expected_result:
      row_count: 3
      rows_by_segment:
        - {segment: Consumer, order_count: 13291, loss_making_order_count: 2864}
        - {segment: Corporate, order_count: 7724, loss_making_order_count: 1667}
        - {segment: Self-Employed, order_count: 4713, loss_making_order_count: 965}
      caveat: "Loss is computed after summing profit across all lines in an order, not when any one line is negative."

  - case_id: q08
    level: intermediate
    source_question_vi: "Nhận diện khách hàng VIP có nguy cơ Churn"
    source_question_en: "Identify VIP customers at risk of churn."
    question_vi: "Tại snapshot 2024-01-01, trả snapshot_date, customer_count, scored_customers, vip_customers, customers_at_risk_90d và vip_customers_at_risk_90d; chỉ số liệu tổng hợp, không trả danh sách khách."
    question_en: "At the 2024-01-01 snapshot, return snapshot_date, customer_count, scored_customers, vip_customers, customers_at_risk_90d, and vip_customers_at_risk_90d; aggregate counts only, no customer list."
    paraphrase_vi: "Trong snapshot 2024-01-01, cho customer_count, scored_customers, vip_customers, customers_at_risk_90d và vip_customers_at_risk_90d; chỉ tổng hợp, không liệt kê khách hàng."
    behavior: approved_template
    source_question_behavior: answer_aggregate_only
    expected_relations: [analytics_gold.mart_customer_rfm]
    expected_columns: [snapshot_date, customer_count, scored_customers, vip_customers, customers_at_risk_90d, vip_customers_at_risk_90d]
    metric_contracts: [customer_count, scored_customers, rfm_vip, rfm_churn_risk, customers_at_risk_90d]
    baseline:
      type: policy_template
      template_id: q08_vip_risk_summary
    expected_result:
      row_count: 1
      scalar:
        snapshot_date: "2024-01-01"
        customer_count: 17415
        scored_customers: 17415
        vip_customers: 3483
        customers_at_risk_90d: 14660
        vip_customers_at_risk_90d: 2732
      caveat: "VIP is the highest Monetary quintile. Risk is a 90-day inactivity heuristic on a historical snapshot, not a churn label or current status."

  - case_id: q09
    level: intermediate
    source_question_vi: "So sánh hành vi Mua chéo (Cross-sell) Consumer vs Corporate"
    source_question_en: "Compare cross-sell behavior for Consumer versus Corporate."
    question_vi: "So sánh Consumer và Corporate theo từng category; trả segment, category, total_sales, segment_total_sales và sales_share_of_segment. Đây là cơ cấu doanh số, không phải sản phẩm mua kèm."
    question_en: "Compare Consumer and Corporate by category; return segment, category, total_sales, segment_total_sales, and sales_share_of_segment. This is revenue mix, not products bought together."
    paraphrase_vi: "Với Consumer và Corporate, cho segment, category, total_sales, segment_total_sales và sales_share_of_segment để so sánh cơ cấu doanh số."
    behavior: answer_with_scope_caveat
    source_question_behavior: answer_with_scope_caveat
    expected_relations: [analytics_gold.mart_category_sales_mix_by_segment]
    expected_columns: [segment, category, total_sales, segment_total_sales, sales_share_of_segment]
    metric_contracts: [sales_share_of_segment]
    baseline:
      type: sql
      sql: |
        SELECT segment, category, total_sales, segment_total_sales, sales_share_of_segment
        FROM analytics_gold.mart_category_sales_mix_by_segment
        WHERE segment IN ('Consumer', 'Corporate')
        ORDER BY segment, category
    expected_result:
      row_count: 12
      scalar_by_segment:
        Consumer: {total_sales: "2146780.00", category_count: 6}
        Corporate: {total_sales: "3840707.00", category_count: 6}
      caveat: "The implemented v1 answer is category revenue mix; it does not show products bought together or prove cross-sell impact."

  - case_id: q10
