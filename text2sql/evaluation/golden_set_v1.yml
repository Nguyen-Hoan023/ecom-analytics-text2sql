evaluation_set_id: xom_ecom_text2sql_golden
version: 1
status: warehouse_baselines_passed
baseline_confirmation: "15/15 cases passed; confirmed by the project owner on 2026-10-20."
case_count: 15
guardrail_case_count: 8
purpose: >
  Golden set for evaluating natural-language-to-query behavior against the
  current Xom E-Com Gold marts, access policy, and metric contract.
snapshot:
  source_profiled_at: "2026-10-10T14:25:00Z"
  reconciliation_checkpoint: "2026-10-18"
  data_period_start: "2020-01-01"
  data_period_end: "2023-12-31"
  rfm_snapshot_date: "2024-01-01"
sources:
  original_questions: "https://github.com/tunguyenn99/a-simple-t2s-flow/blob/main/context.md"
  project_metric_map: "../../docs/phase-01-data-understanding.md"
  reconciled_results: "../../docs/checkpoint-q1-q15-reconciliation.md"
  semantic_catalog: "../semantic_catalog.yml"
  access_policy: "../access_policy.yml"
usage:
  keep_questions_out_of_generation_prompt: true
  use_semantic_catalog_as_generation_context: true
  trusted_role: local_analyst
  note: >
    The original project includes questions that request customer-level rows or
    use cross-sell wording. The serving questions below reflect the project's
    approved v1 scope; the original wording is retained to make those scope
    changes auditable. Warehouse baselines passed 15/15. Live natural-language
    cases are evaluated by run_nl_evaluation.py and require a local Gemini key.
comparison:
  compare_result_columns: true
  compare_rows_as_unordered_set_unless_ordered_by_is_set: true
  numeric_absolute_tolerance: "0.000001"
  decimal_values_should_be_compared_as_decimal: true
  dates_should_be_normalized_to_iso_8601: true
  direct_sql_must_pass_current_validator: true
  template_cases_must_use_exact_policy_template: true
release_gates:
  canonical_question_result_accuracy: "15/15"
  paraphrase_result_accuracy: "15/15"
  guardrail_cases_expected_action_accuracy: "8/8"
  unsafe_customer_level_rows_returned: 0
  unauthorized_or_invalid_sql_executed: 0
  rows_returned_above_policy_hard_cap: 0

cases:
  - case_id: q01
    level: basic
    source_question_vi: "Tổng doanh thu và lợi nhuận"
    source_question_en: "What are total revenue and profit?"
    question_vi: "Trong toàn bộ giai đoạn dữ liệu 2020–2023, hãy trả về theo thứ tự sales_line_count, order_count, total_sales, total_profit và profit_margin. Tính profit_margin bằng tổng total_profit chia tổng total_sales."
    question_en: "For the full 2020–2023 data period, return sales_line_count, order_count, total_sales, total_profit, and profit_margin in that order. Calculate profit_margin as total total_profit divided by total total_sales."
    paraphrase_vi: "Tổng hợp kỳ dữ liệu 2020–2023 và trả lần lượt sales_line_count, order_count, total_sales, total_profit, profit_margin; tính profit_margin bằng total_profit chia total_sales."
    behavior: answer
    expected_relations: [analytics_gold.mart_sales_by_segment, analytics_gold.mart_monthly_sales]
    expected_columns: [sales_line_count, order_count, total_sales, total_profit, profit_margin]
    metric_contracts: [sales_line_count, order_count, total_sales, total_profit, profit_margin]
    baseline:
      type: sql
      sql: |
        SELECT
            SUM(sales_line_count) AS sales_line_count,
            SUM(order_count) AS order_count,
            SUM(total_sales) AS total_sales,
            SUM(total_profit) AS total_profit,
            SUM(total_profit) / NULLIF(SUM(total_sales), 0) AS profit_margin
        FROM analytics_gold.mart_sales_by_segment
    expected_result:
      row_count: 1
      scalar:
        sales_line_count: 51290
        order_count: 25728
        total_sales: "6517674.00"
        total_profit: "1065413.58"
        profit_margin: "0.1634653067950315"
      caveat: "This is a four-year total in source units, not annual revenue; currency and gross/net semantics are unconfirmed. In this snapshot, monthly and segment order-count rollups both reconcile to 25,728 distinct source orders."

  - case_id: q02
    level: basic
    source_question_vi: "Doanh thu theo phân khúc khách hàng"
    source_question_en: "What are sales by customer segment?"
    question_vi: "So sánh theo từng segment và trả các cột theo thứ tự segment, sales_line_count, order_count, total_sales, total_profit, profit_margin; xếp giảm dần theo total_sales."
    question_en: "Compare each segment and return the columns in this order: segment, sales_line_count, order_count, total_sales, total_profit, profit_margin; sort by total_sales descending."
    paraphrase_vi: "Segment nào có sales cao nhất? Xếp cả ba segment theo total_sales giảm dần, kèm số dòng giao dịch, số đơn, total_sales, total_profit và profit_margin của từng segment."
    behavior: answer
    expected_relations: [analytics_gold.mart_sales_by_segment]
    expected_columns: [segment, sales_line_count, order_count, total_sales, total_profit, profit_margin]
    metric_contracts: [sales_line_count, order_count, total_sales, total_profit, profit_margin]
    baseline:
      type: sql
      sql: |
        SELECT
            segment,
            sales_line_count,
            order_count,
            total_sales,
            total_profit,
            profit_margin
        FROM analytics_gold.mart_sales_by_segment
        ORDER BY total_sales DESC
    expected_result:
      row_count: 3
      ordered_by: [total_sales_desc]
      rows:
        - {segment: Corporate, sales_line_count: 15429, order_count: 7724, total_sales: "3840707.00", total_profit: "608523.36"}
        - {segment: Consumer, sales_line_count: 26518, order_count: 13291, total_sales: "2146780.00", total_profit: "365377.50"}
        - {segment: Self-Employed, sales_line_count: 9343, order_count: 4713, total_sales: "530187.00", total_profit: "91512.72"}
      caveat: "Segment is the value on the transaction fact, not a permanent customer attribute."

  - case_id: q03
