    expected_relations: [analytics_gold.mart_product_performance]
    expected_columns: [product_code, product_name, category, units_sold, total_sales, units_sold_rank]
    metric_contracts: [units_sold, total_sales]
    baseline:
      type: sql
      sql: |
        SELECT
            product_code,
            product_name,
            category,
            units_sold,
            total_sales,
            units_sold_rank
        FROM analytics_gold.mart_product_performance
        ORDER BY units_sold_rank
        LIMIT 10
    expected_result:
      row_count: 10
      ordered_by: [units_sold_rank]
      top_rows:
        - {product_code: P000116, units_sold: 1780, total_sales: "67640.00"}
        - {product_code: P000619, units_sold: 1195, total_sales: "15535.00"}
        - {product_code: P000512, units_sold: 518, total_sales: "16058.00"}
        - {product_code: P000114, units_sold: 476, total_sales: "2380.00"}
        - {product_code: P001501, units_sold: 462, total_sales: "5082.00"}
        - {product_code: P000473, units_sold: 460, total_sales: "4140.00"}
        - {product_code: P000976, units_sold: 455, total_sales: "3185.00"}
        - {product_code: P000375, units_sold: 438, total_sales: "3504.00"}
        - {product_code: P000779, units_sold: 425, total_sales: "5100.00"}
        - {product_code: P000126, units_sold: 408, total_sales: "2040.00"}
      caveat: "Best-selling means units_sold in v1. Preserve the source product taxonomy even when labels look inconsistent."

  - case_id: q04
    level: basic
    source_question_vi: "Phân bố số lượng khách hàng theo Giới tính × Nghề nghiệp"
    source_question_en: "How many customers are in each gender-by-occupation group?"
    question_vi: "Đếm customer theo gender × occupation, trả gender, occupation, customer_count; giữ Unknown và chỉ lấy nhóm có customer_count từ 10 trở lên."
    question_en: "Count customers by gender and occupation; return gender, occupation, and customer_count, retain Unknown, and include only groups with at least 10 customers."
    paraphrase_vi: "Cho cơ cấu gender × occupation gồm customer_count, giữ Unknown và lọc customer_count >= 10."
    behavior: answer
    expected_relations: [analytics_gold.mart_customer_profile_by_gender_occupation]
    expected_columns: [gender, occupation, customer_count]
    metric_contracts: [customer_count]
